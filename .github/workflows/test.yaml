name: ZAP Scan with Ignored Plugin IDs

on:
  push:
   branches:
   - Testing # Manual trigger support

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Run ZAP Full Scan
      - name: Run ZAP Scan
        uses: zaproxy/action-full-scan@v0.11.0
        with:
          target: 'http://www.itsecgames.com/'   # URL of the target to scan
          format: 'json'                    # Output format
          report: 'zap_report.zip'          # Report filename
          excludedRule: '40038'       # List of Plugin IDs to ignore
          onlySeverities: 'High,Medium'     # Include only High and Medium severity alerts

      # Step 3: Upload the Report as Artifact
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v3
        with:
          name: zap_scan_report
          path: zap_report.zip
