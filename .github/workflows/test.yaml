name: ZAP Scan with Severity Filtering

on:  
  push:
    branches: [Testing]


jobs:
  zap_scan:
    runs-on: ubuntu-latest
    permissions:
     issues: write

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4


       # Step 2: Create Context File to Exclude Plugin IDs
      - name: Create Exclusion Context File
        run: |
          echo "rules:
          - id: 40038
            action: ignore
          - id: 10038
            action: ignore" > zap_ignore.yaml

      # Step 2: Set up ZAP Scan
      - name: Set up ZAP Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://www.itsecgames.com/'  # URL of the target to scan
          configFile: './zap_ignore.yaml'
          onlySeverities: 'High,Medium' 
          # excludedRule: '40038' 



