name: ZAP Scan with Severity Filtering

on:  
  push:
    branches: [Testing]


jobs:
  zap_scan:
    runs-on: ubuntu-latest
    permissions:
     issues: write

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up ZAP Scan
      - name: Set up ZAP Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://www.itsecgames.com/'  # URL of the target to scan
          onlySeverities: 'High,Medium' 
          excludedRule: '40038' 



