      #     name: filtered_zap_report
      #     path: filtered_zap_report.json

      - name: Download ZAP Scan Artifact
        uses: actions/download-artifact@v3
        with:
          name: zap_scan
          path: zap_reports

      - name: Verify ZAP JSON File
        run: |
          if [ ! -f "zap_reports/report_json.json" ]; then
            echo "ZAP JSON file not found!"
            exit 1
          fi
          echo "ZAP JSON file found: zap_reports/zap.json"
      - name: Verify Directory Structure
        run: |
          echo "Verifying directory structure..."
          ls -R

      - name: Verify zap.py Exists
        run: |
          if [ ! -f "scripts/zap.py" ]; then
            echo "zap.py not found in scripts folder!"
            exit 1
          fi
          echo "zap.py found!"
          
      - name: Install Python Dependencies
        run: pip install requests

      - name: Send ZAP Scan Report to InfluxDB
        env:
          INFLUX_URL: ${{ secrets.INFLUX_URL }}
          INFLUX_TOKEN: ${{ secrets.INFLUX_TOKEN }}
          INFLUX_ORG: ${{ secrets.INFLUX_ORG }}
          INFLUX_BUCKET: ${{ secrets.INFLUX_BUCKET }}
        run: python scripts/zap.py
      
