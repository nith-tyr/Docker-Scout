      - name: Install curl
        run: sudo apt-get install -y curl

      # Step 3: Push JSON to InfluxDB
      - name: Upload JSON to InfluxDB
        run: |
          JSON_FILE="zap_reports/report_json.json"
          INFLUX_URL="${{ secrets.INFLUX_URL }}"
          ORG="${{ secrets.INFLUX_ORG }}"
          BUCKET="${{ secrets.INFLUX_BUCKET }}"
          TOKEN="${{ secrets.INFLUX_TOKEN }}"
          
          if [ -f "$JSON_FILE" ]; then
            echo "zap_reports/report_json.json"
            curl --request POST "$INFLUX_URL/api/v2/write?org=$ORG&bucket=$BUCKET&precision=s" \
              --header "Authorization: Token $TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @"$JSON_FILE"
          else
            echo "JSON file not found!"
            exit 1
          fi
