name: ZAP Scan with Filtered Report

on:
  push:
    branches:
      - Testing

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'  # You can specify a specific version if needed

      - name: Install dependencies (if any)
        run: |
          pip install --upgrade pip  # Upgrading pip
          # Install any dependencies (if necessary)
      
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.11.0
        with:
          target: 'http://www.itsecgames.com/'
          format: 'json'
          report: 'zap_report.json'

      - name: List Current Directory
        run: ls -la

      - name: Filter High and Medium Defects (exclude Low)
        run: |
          python ./scripts/filter_zap_defects.py zap_report.json filtered_zap_report.json

      - name: Upload Filtered Report
        uses: actions/upload-artifact@v3
        with:
          name: filtered_zap_report
          path: filtered_zap_report.json
